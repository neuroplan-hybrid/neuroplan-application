name: Secret script syntax

on:
  pull_request:
    paths:
      - "neuroplan-login-mvp/scripts/00-create-db-secret.sh"
      - "neuroplan-login-mvp/scripts/01-update-db-secret.sh"
      - ".github/workflows/secret-script-syntax.yml"
  push:
    branches:
      - main
    paths:
      - "neuroplan-login-mvp/scripts/00-create-db-secret.sh"
      - "neuroplan-login-mvp/scripts/01-update-db-secret.sh"
      - ".github/workflows/secret-script-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          bash -n neuroplan-login-mvp/scripts/00-create-db-secret.sh
          bash -n neuroplan-login-mvp/scripts/01-update-db-secret.sh
