name: Backend test

on:
  pull_request:
    paths:
      - "neuroplan-login-mvp/backend/**"
      - ".github/workflows/backend-test.yml"
  push:
    branches:
      - main
    paths:
      - "neuroplan-login-mvp/backend/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neuroplan-login-mvp/backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: neuroplan-login-mvp/backend/pom.xml
      - name: Run unit tests
        run: mvn -q test
