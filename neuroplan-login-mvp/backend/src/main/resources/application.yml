server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: neuroplan-auth-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 현재 On-Prem MaxScale 4006 리스너는 TLS를 제공하지 않습니다.
    url: ${DB_URL:jdbc:mariadb://192.168.44.21:4006/infraready?sslMode=disable}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  sql:
    init:
      # 팀 DB에 이미 생성된 인증/학습 테이블을 사용하며 DDL은 실행하지 않습니다.
      # 애플리케이션 계정에는 런타임 CRUD 권한만 부여합니다.
      mode: never

app:
  auth:
    issuer: ${JWT_ISSUER:neuroplan-auth}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    reauth-token-ttl: ${JWT_REAUTH_TTL:5m}
    secure-cookies: ${AUTH_COOKIE_SECURE:true}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
  admin:
    # 쉼표로 구분한 관리자 이메일 허용 목록입니다. DB 스키마 변경 없이 MVP 관리자 권한을 제한합니다.
    emails: ${ADMIN_EMAILS:}
  ai:
    # Gemini 전용 환경변수를 사용합니다. 운영 환경에서는 Kubernetes Secret/ConfigMap으로 주입합니다.
    enabled: ${LLM_ENABLED:true}
    provider: ${LLM_PROVIDER:GEMINI}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    prompt-version: ${LLM_PROMPT_VERSION:neuroplan-0.8.0-gemini-v2}
    max-completion-tokens: ${LLM_MAX_COMPLETION_TOKENS:1200}
    quiz-max-completion-tokens: ${LLM_QUIZ_MAX_COMPLETION_TOKENS:1600}
    daily-token-limit: ${LLM_DAILY_TOKEN_LIMIT:30000}
    connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:60}
  deployment-safety:
    readiness-fail: ${DEMO_READINESS_FAIL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,deploymentSafety
        # Route 53 전환 판단용: DB 장애는 전환 원인에서 제외한다.
        routing:
          include: livenessState,deploymentSafety
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

logging:
  level:
    root: INFO
    com.neuroplan.auth: INFO
